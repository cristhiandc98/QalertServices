<!DOCTYPE html>
<html>
<head>

</head>
<body>

<input id="message" type="text" />

<ul id="messages"></ul>

<script>

    //var path = 'http://localhost:8080/qalert-services/ws';
    //var path = 'https://api.qalert.click/qalert-services/ws';
    console.log(path);


    var socket = new SockJS(path);

    var stompClient = Stomp.over(socket);

    stompClient.connect({}, function(frame) {
        stompClient.subscribe('/payment/QALERT20260300028', function(message) {
            console.log("MENSAJE:", message.body);
        });

    });
</script>

</body>
